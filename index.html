<script id="ll-data" type="application/json">{"meta":{"title":"Lernlandschaft QV Zahntechniker/in EFZ","subtitle":"Vorbereitung auf das Qualifikationsverfahren · Abschlussklasse","updated":"2026-10-29T22:21:00.000Z","lockSelftests":false,"student":false},"areas":[{"key":"FZE","name":"Festsitzender Zahnersatz","color":"#1F4E79","inhalt":"Präparation, Gerüst, Metallkeramik, Vollkeramik/CAD-CAM, Okklusion, Farbe, Endkontrolle"},{"key":"HZE","name":"Herausnehmbarer Zahnersatz","color":"#2E7D32","inhalt":"Modellanalyse, Kennedy, Totalprothese, Modellguss, Kunststoff, Arbeitssicherheit"},{"key":"KFO","name":"Kieferorthopädie","color":"#B45F06","inhalt":"Gebissanalyse, Angle, Drahtbiegen, Platten und Funktionsgeräte, Schienen, digitale Verfahren"},{"key":"NSR","name":"Nachsorge, Service und Reparatur","color":"#6A1B9A","inhalt":"Befund, Reparatur, Erweiterung, Unterfütterung, Hygiene, Dokumentation, Kundengespräch"},{"key":"X","name":"Bereichsübergreifend","color":"#404040","inhalt":""}],"stations":[{"id":"B-FZE-1","title":"Präparation, Zahnschema und Gerüstplanung","meta":"Pflicht · ca. 90 Min. · Input 15 Min. + Verarbeitung","ziel":"Ich kann Präparationsformen (Hohlkehle, Stufe, Tangentialpräparation) erkennen, benennen und für eine gegebene Situation die passende Kronen- bzw. Brückenform und das Gerüstdesign begründen.","material":"Skript-Kapitel «Festsitzender Zahnersatz», 3 Demomodelle mit je einem Stumpf (Hohlkehle / Stufe / Tangential), FDI-Zahnschema-Poster, Lernvideo (von der Lehrperson verlinkt).","auftrag":"1) Theorie-Input (15 Min.): Präparationsformen, Präparationsgrenze, Gerüstgestaltung.\n2) Partnerarbeit: Bestimme an den Demostümpfen die Präparationsform und fülle die Tabelle «Form | geeignete Werkstoffe | typische Risiken» aus.\n3) Einzelarbeit: Fall «Brücke 24–26» (24 und 26 Pfeiler, 25 Brückenglied): Skizziere das Gerüst und begründe die Gestaltung des Brückenglieds (hygienefähig, stabil, ästhetisch).","ergebnis":"OneNote-Seite «FZE 1» (Tabelle + Foto der Skizze).","check":"Lösungsblatt zur Tabelle (Selbstkontrolle); Kriterienraster für die Skizze (Pfeiler, Verbinder, Brückenglied, Begründung) als Partnercheck.","zone":"basis","area":"FZE","lp":""},{"id":"B-FZE-2","title":"Metallkeramik: Werkstoffe, Verbund und Ablauf","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann den Aufbau einer Metallkeramikkrone beschreiben, den Haftverbund (Oxidschicht, Wärmeausdehnungskoeffizient) erklären und die Arbeitsschritte in der richtigen Reihenfolge nennen.","material":"Skript, Datenblätter einer Legierung und einer Verblendkeramik (Herstellerangaben), Ablaufkärtchen (Wachsmodellation, Einbetten, Giessen, Ausbetten, Ausarbeiten, Oxidbrand, Opaker, Dentin-/Schneidemasse, Glanzbrand).","auftrag":"1) Gruppenarbeit (3 Personen): Ablaufkärtchen in die richtige Reihenfolge legen und je Schritt ein Qualitätsmerkmal ergänzen.\n2) Einzelarbeit: Erkläre in 5 Sätzen, warum die WAK-Werte von Legierung und Keramik aufeinander abgestimmt sein müssen und was bei Abweichung passieren kann.\n3) Wahl: Ergebnis als Mindmap ODER als Flussdiagramm festhalten.","ergebnis":"OneNote-Seite «FZE 2» (Foto/Scan der Mindmap oder des Flussdiagramms + 5-Satz-Erklärung).","check":"Partnercheck mit Lösungsblatt (Reihenfolge, Begriffe); Lehrperson-Kurzfeedback beim Checkpoint 1.","zone":"basis","area":"FZE","lp":""},{"id":"B-FZE-3","title":"Vollkeramik und digitaler Workflow (CAD/CAM)","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann den digitalen Workflow (Scan – Design – CAM – Fräsen – Sintern – Finish) beschreiben und einen Werkstoff (z. B. Zirkonoxid, Lithiumdisilikat) einer Indikation zuordnen.","material":"Werkstoff-Steckbriefe (Herstellerangaben), Screenshot-Serie aus der CAD-Software, Muster-Rohlinge/-Weisslinge, Lernvideo.","auftrag":"1) Einzelarbeit: Werkstofftabelle «Werkstoff | Verarbeitung | Indikation | Vor-/Nachteile» ausfüllen.\n2) Partnerarbeit: Erkläre dir gegenseitig, warum Konstruktionen vor dem Sintern vergrössert gefräst werden (Sinterschrumpfung) und welche Konsequenzen das für die Konstruktion hat.\n3) Einzelarbeit: Beschrifte den Workflow auf einem Blanko-Ablaufschema.","ergebnis":"Moodle-Abgabe «FZE 3» (PDF der Tabelle + beschriftetes Schema).","check":"Kriterienraster (Vollständigkeit, Fachbegriffe, Indikationszuordnung); Lehrperson-Checkpoint 1.","zone":"basis","area":"FZE","lp":""},{"id":"B-FZE-4","title":"Okklusion, Farbe und Endkontrolle","meta":"Pflicht · ca. 90 Min. · Praxisstation","ziel":"Ich kann Okklusionskontakte (statisch und dynamisch) am Artikulator prüfen, eine Zahnfarbe mit dem Farbschlüssel bestimmen und eine fertige Arbeit anhand einer Checkliste beurteilen.","material":"Artikulator mit Modellpaar, Artikulationsfolie/-papier, Farbring (Farbschlüssel), Checkliste «Endkontrolle» (Rand, Kontaktpunkte, Form, Oberfläche, Okklusion, Farbe).","auftrag":"1) Partnerarbeit: Okklusionskontakte markieren, Vor- und Laterotrusionsbewegungen prüfen und Auffälligkeiten dokumentieren.\n2) Farbbestimmung bei Tageslicht bzw. Normlicht: Helligkeit zuerst, dann Farbton und Sättigung.\n3) Einzelarbeit: Beurteile eine Beispielkrone mit der Checkliste und formuliere 2 konkrete Verbesserungsmassnahmen.","ergebnis":"OneNote-Seite «FZE 4» (Fotos, ausgefüllte Checkliste).","check":"Peer-Feedback-Raster (siehe Zone 4); Musterbefund der Lehrperson zum Vergleich.","zone":"basis","area":"FZE","lp":""},{"id":"B-HZE-1","title":"Modellanalyse und Kennedy-Klassifikation","meta":"Pflicht · ca. 90 Min. · Input 15 Min. + Verarbeitung","ziel":"Ich kann ein Kiefermodell analysieren (Einschubrichtung, Zahnäquator, Lückenform) und die Lückengebisse nach Kennedy (Klasse I–IV) einordnen.","material":"Skript «Herausnehmbarer Zahnersatz», 4 Fallmodelle bzw. Fotos von Lückengebissen, Parallelometer (Messtisch) und Bleistift/Analysestift.","auftrag":"1) Theorie-Input (15 Min.): Zahnäquator, Einschubrichtung, Klassifikation nach Kennedy.\n2) Partnerarbeit: Ordne 4 Fälle den Kennedy-Klassen zu und zeichne den Zahnäquator an einem Pfeilerzahn ein.\n3) Einzelarbeit: Notiere für einen Fall die geplante Einschubrichtung und begründe sie in 3 Sätzen.","ergebnis":"OneNote-Seite «HZE 1» (Tabelle der 4 Fälle + Foto der Analyse).","check":"Lösungsblatt (Klassen I–IV); Partnercheck der Begründung mit Kriterienraster.","zone":"basis","area":"HZE","lp":""},{"id":"B-HZE-2","title":"Totalprothese: Kieferrelation, Aufstellung, Ränder","meta":"Pflicht · ca. 120 Min.","ziel":"Ich kann die Schritte von der Funktionsabformung bis zur Zahnaufstellung einer Totalprothese erklären und die Aufstellung (Okklusionsebene, Spee- und Wilson-Kurve, Frontzahnästhetik) nach Kriterien beurteilen.","material":"Skript, Artikulator mit Wachswall-Schablonen, Gesichtsbogen-Demo, Aufstellmodell mit Prothesenzähnen, Kriterienliste «Aufstellung».","auftrag":"1) Gruppenarbeit: Lege die Arbeitsschritte (Funktionsabformung, individueller Löffel, Bissnahme, Gesichtsbogenübertragung, Aufstellung, Anprobe) in die richtige Reihenfolge und notiere je Schritt «Wozu?».\n2) Partnerarbeit: Beurteile ein fertig aufgestelltes Modell anhand der Kriterienliste (Mittellinie, Lippenstütze, Okklusionsebene, Kurven).\n3) Einzelarbeit: Erkläre Ventilrand und dorsalen Abschluss (Postdamm) in je 2 Sätzen.","ergebnis":"OneNote-Seite «HZE 2» (Ablaufkarte + Beurteilungsbogen).","check":"Lösungsblatt; Lehrperson-Checkpoint 1 (Kurzgespräch am Modell).","zone":"basis","area":"HZE","lp":""},{"id":"B-HZE-3","title":"Modellgussprothese und Klammersysteme","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann die Bestandteile einer Modellgussprothese (Auflagen, Klammern, Verbinder, Sättel) benennen und für einen Fall ein passendes Klammersystem inklusive Begründung auswählen.","material":"Skript, Muster-Modellgussprothese (Demo), Fallkarten, Konstruktionsvorlage (Modellskizze).","auftrag":"1) Beschrifte die Bestandteile an der Demoprothese (Foto + Beschriftung).\n2) Partnerarbeit: Unterscheide retentive und stabilisierende Klammerarme (Lage zum Zahnäquator) und trage sie in die Modellskizze ein.\n3) Einzelarbeit: Konstruiere auf der Skizze eine Modellgussprothese für einen Fall der Klasse III nach Kennedy (Auflagen, Klammern, Verbinder).","ergebnis":"OneNote-Seite «HZE 3» (Beschriftung + Konstruktionsskizze).","check":"Kriterienraster (Auflagen, Klammerlage, Verbinder, Begründung); Lösungsvorschlag zur Selbstkontrolle.","zone":"basis","area":"HZE","lp":""},{"id":"B-HZE-4","title":"Prothesenkunststoff, Ausarbeitung und Arbeitssicherheit","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann Verfahren zur Verarbeitung von Prothesenkunststoff (Heiss-/Kaltpolymerisation, Spritzguss, CAD/CAM) vergleichen und die Arbeitssicherheit beim Umgang mit Monomer und Staub nennen.","material":"Skript, Sicherheitsdatenblatt (SDB) eines Prothesenkunststoffs, Vergleichstabelle (Blanko).","auftrag":"1) Einzelarbeit: Vergleichstabelle «Verfahren | Ablauf | Vorteile | Nachteile» ausfüllen.\n2) Partnerarbeit: Lies im SDB die Gefahrenhinweise (H-Sätze) und Schutzmassnahmen und fasse 5 Punkte zusammen.\n3) Einzelarbeit: Beschreibe die Ausarbeitung und Politur einer Prothese in 6 Schritten.","ergebnis":"OneNote-Seite «HZE 4» (Tabelle + SDB-Zusammenfassung).","check":"Lösungsblatt; Lehrperson-Visum für die SDB-Zusammenfassung.","zone":"basis","area":"HZE","lp":""},{"id":"B-KFO-1","title":"Gebissanalyse: Angle-Klassen, Overjet und Overbite","meta":"Pflicht · ca. 90 Min. · Input 15 Min. + Verarbeitung","ziel":"Ich kann ein Gebiss nach Angle-Klassen (I–III) einordnen und Overjet, Overbite sowie häufige Zahnstellungsanomalien erkennen und beschreiben.","material":"Skript «Kieferorthopädie», Modellpaare (4 Fälle), Messlineal/Messschieber, Fotos von Gebissanomalien.","auftrag":"1) Theorie-Input (15 Min.): Angle-Klassifikation, Overjet, Overbite, Engstand, Kreuzbiss, offener Biss.\n2) Partnerarbeit: Ordne 4 Modellpaare einer Angle-Klasse zu und miss Overjet bzw. Overbite.\n3) Einzelarbeit: Beschreibe einen Fall in einem Befundtext (max. 6 Sätze) in korrekter Fachsprache.","ergebnis":"OneNote-Seite «KFO 1» (Befundtabelle + Befundtext).","check":"Lösungsblatt (Angle-Klassen, Messwerte); Partnercheck der Fachsprache.","zone":"basis","area":"KFO","lp":""},{"id":"B-KFO-2","title":"Drahtbiegen: Adams-Klammer und Labialbogen","meta":"Pflicht · ca. 120 Min. · Praxisstation","ziel":"Ich kann eine Adams-Klammer und einen Labialbogen nach Konstruktionsskizze biegen und die Funktion jedes Drahtelements erklären.","material":"Biegezangen, Drähte gemäss Vorgabe der Lehrperson, Konstruktionszeichnungen, Arbeitsmodell, Kriterienliste «Drahtarbeit».","auftrag":"1) Einzelarbeit: Zeichne die Konstruktion der Adams-Klammer auf dem Modell vor und beschrifte Funktion (Retention) und Lage der Elemente.\n2) Biege die Klammer und den Labialbogen; achte auf Kanten, Knickstellen und Passung.\n3) Partnerarbeit: Gegenseitige Beurteilung der Drahtarbeit mit der Kriterienliste.","ergebnis":"OneNote-Seite «KFO 2» (Foto der Arbeit am Modell + Kriterienliste); Arbeit zur Abnahme bereitlegen.","check":"Kriterienraster Drahtarbeit (Passung, Oberfläche, Lage, Funktion); Lehrperson-Checkpoint 2.","zone":"basis","area":"KFO","lp":""},{"id":"B-KFO-3","title":"Herausnehmbare Apparaturen: Platte, Aktivator, Retainer","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann den Aufbau und die Wirkung einer aktiven Platte mit Dehnschraube, eines funktionskieferorthopädischen Geräts (z. B. Aktivator) und eines Retainers beschreiben und passende Indikationen nennen.","material":"Demoapparaturen, Skript, Steckbriefkarten, Foto-Serie «Plattenherstellung» (Kunststoff im Streu- oder Giessverfahren).","auftrag":"1) Gruppenarbeit: Je eine Apparatur als Steckbrief erarbeiten (Bestandteile, Wirkprinzip, Indikation, Tragedauer-Hinweis gemäss Skript).\n2) Gallery Walk: Steckbriefe der anderen Gruppen lesen und 3 Lernfragen notieren.\n3) Einzelarbeit: Beschreibe 6 Arbeitsschritte der Herstellung einer Platte.","ergebnis":"OneNote-Seite «KFO 3» (Steckbrief als Bild + Arbeitsschritte).","check":"Lösungsblatt; Partnercheck mit Fragenkarten.","zone":"basis","area":"KFO","lp":""},{"id":"B-KFO-4","title":"Schienen, digitale Verfahren und festsitzende Hilfsmittel","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann Schienenarten (Tiefziehschiene, Aufbissschiene, Retainer) unterscheiden, den digitalen Ablauf (Scan – Planung – Druck/Tiefziehen) erklären und festsitzende Hilfsmittel (z. B. Gaumennahterweiterung, Lingualbogen) benennen.","material":"Musterschienen, Tiefziehfolien-Datenblatt, Screenshots eines Set-ups, Skript.","auftrag":"1) Einzelarbeit: Tabelle «Schienenart | Zweck | Material | Herstellung» ausfüllen.\n2) Partnerarbeit: Beschrifte den digitalen Workflow und nenne je Schritt einen möglichen Fehler.\n3) Einzelarbeit: Ordne 4 festsitzende Hilfsmittel ihren Wirkungen zu (Kartenzuordnung).","ergebnis":"Moodle-Abgabe «KFO 4» (Tabelle + beschrifteter Ablauf).","check":"Kriterienraster; Lehrperson-Checkpoint 2.","zone":"basis","area":"KFO","lp":""},{"id":"B-NSR-1","title":"Auftragsannahme, Befund und Entscheid: Reparatur oder Neuanfertigung","meta":"Pflicht · ca. 90 Min. · Input 15 Min. + Verarbeitung","ziel":"Ich kann einen eingehenden Reparaturauftrag befunden, die Schadensursache einschätzen und begründet entscheiden, ob repariert, erweitert oder neu angefertigt wird.","material":"Skript «Nachsorge, Service und Reparatur», 4 Schadensfälle (Fotos und Kurzbeschrieb), Auftragsformular-Vorlage.","auftrag":"1) Theorie-Input (15 Min.): Befundung, Schadensarten, Entscheidungskriterien.\n2) Partnerarbeit: Fülle für 2 Fälle das Auftragsformular aus (Schaden, vermutete Ursache, Massnahme, Rückfragen an die Praxis).\n3) Einzelarbeit: Entscheidungsbaum «Reparatur – Erweiterung – Neuanfertigung» zeichnen.","ergebnis":"OneNote-Seite «NSR 1» (Formular + Entscheidungsbaum).","check":"Lösungsvorschlag der Lehrperson; Kriterienraster für den Entscheidungsbaum.","zone":"basis","area":"NSR","lp":""},{"id":"B-NSR-2","title":"Prothesenreparatur, Erweiterung und Unterfütterung","meta":"Pflicht · ca. 120 Min. · Praxisstation","ziel":"Ich kann einen Prothesenbruch reparieren, einen Zahn ergänzen und eine Unterfütterung planen und die Arbeitsschritte fachlich begründen.","material":"Gebrochene Übungsprothese, Kaltpolymerisat, Ausarbeitungsset, Arbeitsanleitung der Schule/des Betriebs, Fotoprotokoll-Vorlage.","auftrag":"1) Einzelarbeit: Plane die Reparatur (Fixieren der Bruchstücke, Modell herstellen, Bruchspalt vorbereiten, Kunststoff auftragen, Polymerisation, Ausarbeiten, Politur) schriftlich.\n2) Praxis: Führe die Reparatur an der Übungsprothese gemäss Anleitung durch und dokumentiere 3 Schlüsselschritte mit Fotos.\n3) Partnerarbeit: Erkläre dem Partner den Unterschied zwischen Reparatur, Erweiterung und Unterfütterung.","ergebnis":"OneNote-Seite «NSR 2» (Fotoprotokoll + Plan).","check":"Kriterienraster (Festigkeit, Passung, Oberfläche, Ablauf); Lehrperson-Checkpoint 2.","zone":"basis","area":"NSR","lp":""},{"id":"B-NSR-3","title":"Reparatur festsitzender Arbeiten und Kleinreparaturen","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann Reparaturmöglichkeiten bei festsitzendem Zahnersatz (z. B. Verblendfraktur, Kronenrand, Lötung bzw. Laserschweissen) benennen und das geeignete Verfahren für einen Fall begründen.","material":"Skript, Fallkarten, Verfahrenskarten (Material, Vorteile, Grenzen), Herstellerangaben zu Reparatursystemen.","auftrag":"1) Gruppenarbeit: Ordne 4 Schadensbilder den passenden Reparaturverfahren zu und nenne jeweils eine Grenze des Verfahrens.\n2) Einzelarbeit: Schreibe eine Empfehlung an die Zahnarztpraxis (max. 5 Sätze): reparieren oder neu anfertigen.","ergebnis":"OneNote-Seite «NSR 3» (Zuordnung + Empfehlungstext).","check":"Lösungsblatt; Partnercheck des Empfehlungstexts.","zone":"basis","area":"NSR","lp":""},{"id":"B-NSR-4","title":"Hygiene, Dokumentation und Kundengespräch","meta":"Pflicht · ca. 90 Min.","ziel":"Ich kann die Hygienemassnahmen bei Eingang und Ausgang von Arbeiten erklären, einen Reparaturauftrag lückenlos dokumentieren und ein Kundengespräch bei einer Reklamation strukturiert führen.","material":"Hygienekonzept des Betriebs bzw. der Schule, Dokumentationsvorlage, Rollenkarten (Zahnarztpraxis / Labor), Beobachtungsbogen.","auftrag":"1) Einzelarbeit: Erstelle eine Checkliste «Wareneingang – Desinfektion – Bearbeitung – Ausgang».\n2) Rollenspiel (Dreiergruppe: Praxis, Labor, Beobachter/in): Reklamation «Prothese drückt» bzw. «Krone zu hoch». Gespräch in 4 Schritten: zuhören, Sachverhalt klären, Lösung anbieten, Vereinbarung festhalten.\n3) Beobachter/in gibt Feedback mit Beobachtungsbogen.","ergebnis":"OneNote-Seite «NSR 4» (Checkliste + Feedback-Bogen); optional Audio/Video nur mit Einverständnis.","check":"Beobachtungsbogen (Peer); Lehrperson-Checkpoint 2.","zone":"basis","area":"NSR","lp":""},{"id":"V-FZE-1","title":"Wahlstation «Wähle 2 aus 4»","meta":"Wahl · ca. 2 × 60 Min.","ziel":"Ich kann ein Spezialthema im Bereich festsitzender Zahnersatz selbstständig erarbeiten und für andere verständlich aufbereiten.","material":"Skript, Fachliteratur/Herstellerunterlagen, Vorlagen für Mindmap, Tabelle, Erklärclip.","auftrag":"Wähle 2 der 4 Aufgaben:\nA) Implantatgetragene Suprakonstruktion: Unterschied zwischen zementierter und verschraubter Versorgung (Vor-/Nachteile).\nB) Brückenglieder hygienefähig gestalten: 3 Formen skizzieren und bewerten.\nC) Werkstoffvergleich Metallkeramik – Zirkonoxid – Lithiumdisilikat: Entscheidungsmatrix für 3 Fälle.\nD) 90-Sekunden-Erklärclip «Wie entsteht eine Zirkonoxidkrone?».\nFormat frei wählbar: Mindmap ODER tabellarische Zusammenfassung ODER Clip.","ergebnis":"e-Portfolio (OneNote-Seite «FZE Vertiefung 1») bzw. Moodle-Abgabe.","check":"Kriterienraster «Vertiefung» (Fachlichkeit, Struktur, Fachsprache, Quellenangabe); Peer-Feedback durch 1 Person.","zone":"vertiefung","area":"FZE","lp":""},{"id":"V-FZE-2","title":"Fehleranalyse: Vier Fehlerbilder, vier Ursachen","meta":"Wahl (Profi) · ca. 90 Min.","ziel":"Ich kann Fehler an festsitzendem Zahnersatz analysieren, Ursachen eingrenzen und eine Korrektur- und Vorbeugungsmassnahme vorschlagen.","material":"4 Fallkarten mit Foto und Kurzbeschrieb: (1) Abplatzung der Verblendkeramik am Höcker, (2) offener Kronenrand, (3) Lunker im Gussobjekt, (4) Farbabweichung zur Nachbarzahnreihe. Raster «Fehler – Ursache – Korrektur – Prävention».","auftrag":"Gruppenarbeit (3 Personen): Jede Person übernimmt 1–2 Fälle, danach gegenseitig erklären. Pro Fall mindestens 2 mögliche Ursachen nennen und mit Hinweisen aus der Fallkarte begründen, welche am wahrscheinlichsten ist.","ergebnis":"OneNote-Seite «FZE Fehleranalyse» (ausgefülltes Raster).","check":"Musterlösung (mehrere akzeptierte Ursachen); Tipp-Karten (3 Stufen) bei Bedarf.","zone":"vertiefung","area":"FZE","lp":""},{"id":"V-FZE-3","title":"Mini-Escape «Der verschwundene Kronenrand»","meta":"Wahl · ca. 45 Min. · optional: schaltet den Selbsttest FZE frei","ziel":"Ich kann Zahnschema (FDI), Fachbegriffe und Arbeitsschritte unter Zeitdruck sicher anwenden.","material":"Rätselkarten, 4-stelliges (oder 8-stelliges) Zahlenschloss bzw. Moodle-Test mit Passwort, Umschlag «Tipp-Karte».","auftrag":"Szenario: In der Zahnarztpraxis fehlt eine Arbeit – nur wenn du den Code findest, erhältst du den Lieferschein. Rätsel 1 (FDI-Code): Lies die vier Zahnbezeichnungen und schreibe die FDI-Nummern in dieser Reihenfolge: oberer rechter mittlerer Schneidezahn – unterer linker erster Molar – oberer linker Eckzahn – unterer rechter zweiter Prämolar.\nCode = die acht Ziffern der vier FDI-Nummern hintereinander.","ergebnis":"Foto der gelösten Karten im OneNote; «Freischaltcode» in das Moodle-Feld eintragen.","check":"Selbstkontrolle über das Schloss bzw. den Moodle-Test; Lehrperson gibt auf Wunsch Tipp-Karten heraus.","zone":"vertiefung","area":"FZE","lp":"","type":"escape","code":"11362345","unlocks":"FZE"},{"id":"V-HZE-1","title":"Wahlstation «Wähle 2 aus 4»","meta":"Wahl · ca. 2 × 60 Min.","ziel":"Ich kann ein Spezialthema im Bereich herausnehmbarer Zahnersatz selbstständig erarbeiten und verständlich darstellen.","material":"Skript, Herstellerunterlagen, Demoobjekte, Vorlagen für Mindmap/Tabelle/Clip.","auftrag":"Wähle 2 der 4 Aufgaben:\nA) Kombinierter Zahnersatz: Teleskop- bzw. Geschiebeversorgung im Überblick (Aufbau, Vorteile, Nachteile).\nB) Implantatgetragene Prothese: Wie wird die Retention erreicht? (Prinzipskizze)\nC) Digital gefertigte Prothesen: Ablauf und Unterschiede zur konventionellen Fertigung (Vergleichstabelle).\nD) Konstruktionsentwurf einer Modellgussprothese für einen Fall der Klasse I nach Kennedy.\nDarstellung: Mindmap ODER Tabelle ODER Skizze mit Legende.","ergebnis":"OneNote-Seite «HZE Vertiefung 1» bzw. Moodle-Abgabe.","check":"Kriterienraster «Vertiefung»; Peer-Feedback durch 1 Person.","zone":"vertiefung","area":"HZE","lp":""},{"id":"V-HZE-2","title":"Fallstudie: «Die Prothese drückt und wackelt»","meta":"Wahl (Profi) · ca. 90 Min.","ziel":"Ich kann einen Reklamationsfall bei herausnehmbarem Zahnersatz systematisch analysieren und mögliche Ursachen und Massnahmen priorisieren.","material":"Fallbeschreibung (fiktiv): Totalprothese Unterkiefer, Patient berichtet über Druckstellen und Lockerung beim Kauen; Modellfotos, Prothesenrand-Foto, Okklusionsbefund.","auftrag":"Einzelarbeit, dann Austausch zu zweit: 1) Mögliche Ursachen sammeln (z. B. Randgestaltung, Okklusion, Passung/Unterfütterungsbedarf, Zahnaufstellung). 2) Ursachen nach Wahrscheinlichkeit ordnen und begründen. 3) Vorgehen für die Rückmeldung an die Zahnarztpraxis formulieren (max. 6 Sätze).","ergebnis":"OneNote-Seite «HZE Fallstudie».","check":"Musterlösung mit mehreren zulässigen Lösungswegen; Lehrperson-Feedback bei Checkpoint 3.","zone":"vertiefung","area":"HZE","lp":""},{"id":"V-HZE-3","title":"Mini-Escape «Das Lückengebiss-Labor»","meta":"Wahl · ca. 45 Min. · optional: schaltet den Selbsttest HZE frei","ziel":"Ich kann Kennedy-Klassen und Bestandteile einer Modellgussprothese sicher zuordnen.","material":"4 Fallkarten, Zahlenschloss, Umschlag mit Lösungsblatt.","auftrag":"Szenario: Der Schrank mit dem Gipsmodell ist verschlossen. Ordne die 4 Fallkarten den Kennedy-Klassen zu: Fall 1 einseitige Schaltlücke, Fall 2 beidseitige Freiendlücke, Fall 3 Frontzahnlücke über die Mittellinie, Fall 4 einseitige Freiendlücke. Der Code besteht aus den Klassen in der Reihenfolge der Fälle (römische Zahlen als arabische Ziffern).","ergebnis":"Foto der Zuordnung im OneNote; Code im Moodle-Feld eintragen.","check":"Selbstkontrolle über das Schloss; bei Fehlversuch Tipp-Karte 1.","zone":"vertiefung","area":"HZE","lp":"","type":"escape","code":"3142","unlocks":"HZE"},{"id":"V-KFO-1","title":"Wahlstation «Wähle 2 aus 4»","meta":"Wahl · ca. 2 × 60 Min.","ziel":"Ich kann ein Spezialthema der Kieferorthopädie selbstständig erarbeiten und verständlich darstellen.","material":"Skript, Herstellerunterlagen, Demoapparaturen, Vorlagen.","auftrag":"Wähle 2 der 4 Aufgaben:\nA) Vergleiche Aktivator und Twin-Block: Wirkprinzip, Aufbau, Indikation (Tabelle).\nB) Gaumennahterweiterung: Aufbau und Wirkung (Skizze mit Legende).\nC) Aligner-Set-up: Erkläre den Weg vom Scan zur Schiene (Ablaufdiagramm, Fehlerquellen).\nD) Qualitätskriterien für Drahtarbeiten: Erstelle eine Checkliste (mindestens 8 Kriterien).\nDarstellung: Tabelle ODER Skizze ODER Ablaufdiagramm.","ergebnis":"OneNote-Seite «KFO Vertiefung 1» bzw. Moodle-Abgabe.","check":"Kriterienraster «Vertiefung»; Peer-Feedback.","zone":"vertiefung","area":"KFO","lp":""},{"id":"V-KFO-2","title":"Fallstudie: Distalbiss mit Engstand","meta":"Wahl (Profi) · ca. 90 Min.","ziel":"Ich kann für einen kieferorthopädischen Fall eine geeignete Apparatur auswählen und die Wahl fachlich begründen.","material":"Fallbeschreibung (fiktiv): Jugendlicher mit Angle-Klasse II und Engstand im Unterkiefer; Modellfotos, Messwerte (Overjet, Overbite), Auftrag der Praxis.","auftrag":"Einzelarbeit: 1) Befund in Fachsprache zusammenfassen. 2) Mindestens 2 Apparaturen vergleichen (Vor-/Nachteile) und eine begründet auswählen. 3) Arbeitsschritte der Herstellung skizzieren und Rückfragen an die Praxis formulieren.","ergebnis":"OneNote-Seite «KFO Fallstudie».","check":"Musterlösung; Lehrperson-Feedback beim Checkpoint 3.","zone":"vertiefung","area":"KFO","lp":""},{"id":"V-KFO-3","title":"Mini-Escape «Das Gebissmodell-Rätsel»","meta":"Wahl · ca. 45 Min. · optional: schaltet den Selbsttest KFO frei","ziel":"Ich kann Angle-Klassen, Anomalien und Apparaturen sicher zuordnen.","material":"4 Modellfotos, Zahlenschloss, Lösungsumschlag.","auftrag":"Szenario: Die Apparaturenbox ist verschlossen. Bestimme die Angle-Klasse der 4 Modellfotos (Fall 1 Distalbiss, Fall 2 Neutralbiss, Fall 3 Mesialbiss, Fall 4 Neutralbiss mit Engstand). Code = Klasse je Fall in dieser Reihenfolge (Klasse II = 2, I = 1, III = 3).","ergebnis":"Foto der Zuordnung im OneNote; Code im Moodle-Feld eintragen.","check":"Selbstkontrolle über das Schloss; Tipp-Karte 1 bei Bedarf.","zone":"vertiefung","area":"KFO","lp":"","type":"escape","code":"2131","unlocks":"KFO"},{"id":"V-NSR-1","title":"Wahlstation «Wähle 2 aus 4»","meta":"Wahl · ca. 2 × 60 Min.","ziel":"Ich kann ein Spezialthema aus Nachsorge, Service oder Reparatur selbstständig erarbeiten und verständlich darstellen.","material":"Skript, Herstellerunterlagen, Betriebsrichtlinien, Vorlagen.","auftrag":"Wähle 2 der 4 Aufgaben:\nA) Reparatur einer Verblendkeramik: Vorgehen und Grenzen (Ablaufschema).\nB) Prothesenhygiene: Empfehlungen für Patientinnen und Patienten (Merkblatt in einfacher Sprache).\nC) Kosten-Nutzen-Vergleich Reparatur vs. Neuanfertigung (Tabelle mit 3 Fällen).\nD) Dokumentation und Rückverfolgbarkeit: Vorlage für einen Reparaturauftrag entwerfen.\nDarstellung: Merkblatt ODER Tabelle ODER Ablaufschema.","ergebnis":"OneNote-Seite «NSR Vertiefung 1» bzw. Moodle-Abgabe.","check":"Kriterienraster «Vertiefung»; Peer-Feedback.","zone":"vertiefung","area":"NSR","lp":""},{"id":"V-NSR-2","title":"Praxis-Szenario: Dringender Reparaturauftrag","meta":"Wahl (Profi) · ca. 90 Min.","ziel":"Ich kann bei einem dringenden Auftrag Prioritäten setzen, den Ablauf planen und mit der Praxis klar kommunizieren.","material":"Szenario-Karte: Freitag 15 Uhr, Telefonat der Praxis, Prothese gebrochen, Patient hat am Montagmorgen einen Termin. Auftragsformular, Wochenplan der Werkstatt (fiktiv).","auftrag":"Partnerarbeit: 1) Befundfragen für das Telefonat sammeln. 2) Ablaufplan mit Zeitbedarf erstellen. 3) Antwort per E-Mail an die Praxis formulieren (Termin, Vorgehen, Hinweise). 4) Risiken nennen und Alternativen festlegen.","ergebnis":"OneNote-Seite «NSR Szenario» (Plan + E-Mail-Text).","check":"Musterlösung; Peer-Feedback zur E-Mail (Verständlichkeit, Höflichkeit, Vollständigkeit).","zone":"vertiefung","area":"NSR","lp":""},{"id":"V-NSR-3","title":"Mini-Escape «Die Reparatur-Reihenfolge»","meta":"Wahl · ca. 45 Min. · optional: schaltet den Selbsttest NSR frei","ziel":"Ich kann die Arbeitsschritte einer Prothesenreparatur in der richtigen Reihenfolge nennen.","material":"5 Schrittkarten (A–E) mit je einer Zahl auf der Rückseite, Umschlag mit Lösungsblatt.","auftrag":"Szenario: Der Schlüssel zur Werkstatt liegt im Umschlag. Ordne die Karten in der richtigen Reihenfolge: A Bruchstücke fixieren und Modell herstellen, B Bruchspalt vorbereiten, C Flächen mit Monomer benetzen, D Kaltpolymerisat auftragen und polymerisieren, E Ausarbeiten und polieren. Jede Karte trägt eine Zahl: A = 3, B = 1, C = 5, D = 2, E = 4. Der Code ergibt sich aus den Zahlen in der richtigen Reihenfolge der Schritte.","ergebnis":"Foto der geordneten Karten im OneNote; Code im Moodle-Feld eintragen.","check":"Selbstkontrolle über den Moodle-Test; Tipp-Karte 1 bei Bedarf.","zone":"vertiefung","area":"NSR","lp":"","type":"escape","code":"31524","unlocks":"NSR"},{"id":"V-X-1","title":"Integrationsfall «Frau M., 68 Jahre» (bereichsübergreifend)","meta":"Wahl (Profi) · ca. 3 × 45 Min.","ziel":"Ich kann einen komplexen Fall bereichsübergreifend planen, Arbeitsschritte begründen und das Vorgehen strukturiert darstellen.","material":"Fiktive Fallakte: Oberkiefer Teilprothese (Modellguss, Klasse III) mit vorhandener Krone auf Pfeilerzahn, Unterkiefer Totalprothese mit Reparaturbedarf; Modellfotos, Röntgenbild-Beschrieb (fiktiv), Auftrag der Praxis.","auftrag":"Gruppenarbeit (3–4 Personen): 1) Arbeitsplan über alle betroffenen Bereiche (HZE, FZE, NSR). 2) Zeit- und Materialplan. 3) Risikoliste mit 5 Punkten. 4) 5-Minuten-Präsentation vor der Klasse.","ergebnis":"Gruppenseite im Class Notebook (Inhaltsbibliothek bzw. Gruppenabschnitt), Präsentation als PDF.","check":"Kriterienraster Präsentation und Planung; Feedback der Lehrperson und einer Partnergruppe.","zone":"vertiefung","area":"X","lp":""}],"zone1":{"intro":"Kompass für die Lernenden: Wo stehe ich, was muss ich können, bis wann, und welchen Weg wähle ich?","lernziele":["… in jedem der vier Bereiche die zentralen Fachbegriffe, Arbeitsschritte und Werkstoffe sicher erklären.","… Arbeitsaufträge planen, begründet entscheiden und meinen Ablauf strukturiert dokumentieren.","… eigene Arbeiten anhand von Kriterien beurteilen und Verbesserungen ableiten.","… mein Fachwissen mündlich (Fachgespräch, Kundengespräch) verständlich darlegen."],"zeitplanHinweis":"Daten in eckigen Klammern sind von der Lehrperson einzutragen. Nur die als Termine genannten QV-Daten stammen aus öffentlichen Informationen (Kanton Zürich, VZLS-ZH-SH); bitte für die eigene Klasse bestätigen.","zeitplan":[{"phase":"0 Start","zeitraum":"Nov. 2026","inhalt":"Kick-off, Lernvertrag, Selbsteinschätzung (Kompetenzraster), Einführung OneNote/Moodle","termin":"[Datum]: Lernvertrag abgeben"},{"phase":"1 Basis I","zeitraum":"Nov.–Dez. 2026","inhalt":"B-FZE-1 bis 4, B-HZE-1 bis 4","termin":"Checkpoint A [Datum]"},{"phase":"2 Basis II","zeitraum":"Jan.–Feb. 2027","inhalt":"B-KFO-1 bis 4, B-NSR-1 bis 4","termin":"Checkpoint B [Datum]; Prüfungsdaten QV 2027 werden im Februar 2027 veröffentlicht (VZLS-ZH-SH)"},{"phase":"3 Vertiefung","zeitraum":"Feb.–März 2027","inhalt":"Wahl-Stationen, Fallstudien, Escape-Rätsel","termin":"Checkpoint C [Datum]; Portfolio-Zwischenstand"},{"phase":"4 Prüfungsvorbereitung","zeitraum":"März–Mai 2027","inhalt":"Selbsttests, Prüfungssimulation (Fachgespräch, Kundengespräch, Zeitmanagement), Tipp-Karten","termin":"Simulation [Datum]"},{"phase":"5 QV","zeitraum":"April–Juni 2027 (in der Regel, Kanton ZH)","inhalt":"Prüfungen gemäss Aufgebot (mindestens 4 Wochen vorher); Allgemeinbildung Schlussprüfung am 14. Juni 2027","termin":"Resultate bis 16. Juli 2027 (Kanton ZH)"}],"nachteilsausgleich":"Hinweis Nachteilsausgleich (Kanton ZH): Der Antrag muss spätestens am 31. Oktober des letzten Lehrjahres beim Mittelschul- und Berufsbildungsamt eingereicht werden.","pfade":[{"weg":"Basis (Mindestweg)","was":"Alle Basisstationen B-… bearbeiten, alle Checks bestanden","voraus":"Start für alle","fuer":"Alle Lernenden"},{"weg":"Standard","was":"Basis + mindestens 1 Vertiefungsstation je Bereich (V-…-1 oder V-…-3)","voraus":"Basis-Check des Bereichs mit mindestens 80 % oder Lehrperson-Visum","fuer":"Lernende mit sicherem Grundwissen"},{"weg":"Profi","was":"Standard + Fallstudie (V-…-2) je Bereich + Integrationsfall V-X-1","voraus":"Alle Basis-Checks grün, Selbsttest FZE/HZE mit mindestens 80 %","fuer":"Leistungsstarke, Interessierte"}],"ampelHinweis":"Ampel: Rot = noch unsicher, Orange = mit Hilfe möglich, Grün = sicher (mit Nachweis).","vertrag":["Ich wähle meinen Weg (Basis / Standard / Profi) und trage mein Ziel für das QV ein.","Ich plane pro Woche mindestens zwei Lernblöcke und trage sie in meinen Wochenplan ein.","Ich dokumentiere jedes Ergebnis auf der Stationsseite und hole Checks ein.","Ich nutze Tipp-Karten erst nach eigenem Versuch (Stufe 1 vor Stufe 2 vor Stufe 3).","Ich gebe Peer-Feedback mit dem Raster und bleibe respektvoll und konkret."],"hinweise":["Abgleich mit dem QV: Die vier Fachbereiche entsprechen den Handlungskompetenzbereichen des Bildungsplans (Berufsnummer 54104). In der Wegleitung (Stand Oktober 2022) sind die praktischen Prüfungsarbeiten als Position 1 (abnehmbarer Zahnersatz) und Position 2 (festsitzender Zahnersatz) sowie als mündliche Positionen (Kundengespräch, Fachgespräch) aufgeführt. KFO und NSR sind dort nicht als eigene praktische Position ausgewiesen. Bitte mit der Wegleitung des Prüfungsjahres abgleichen.","Bildungsplan: Ein Entwurf eines neuen Bildungsplans war im Juni 2026 in Vernehmlassung. Für die Abschlussklasse gilt bis zur Bestätigung durch die Prüfungsleitung der bisherige Bildungsplan.","Gewichtung: Praktische Arbeit 40 %, Berufskenntnisse 20 %, Allgemeinbildung 20 %, Erfahrungsnote 20 % stammen aus einer Drittquelle. Faktenlage unsicher: in den Ausführungsbestimmungen bestätigen.","Alle Zahlen, Codes und Lösungen in Rätseln und Selbsttests sind Vorschläge und vor dem Einsatz zu prüfen."],"bereichsTimeline":[{"key":"FZE","zeitraum":"November–Dezember 2026","ziel":"bis 18. Dezember 2026","fokus":"Basisstationen abschliessen, Ergebnisse sichern und Unsicherheiten markieren.","meilensteine":[{"nr":"M1","titel":"Präparationsformen und Gerüstplanung sicher bearbeiten","termin":"27. November 2026"},{"nr":"M2","titel":"Werkstoffe, Verblendung und Okklusion verknüpfen","termin":"11. Dezember 2026"},{"nr":"M3","titel":"Bereichscheck FZE abschliessen","termin":"18. Dezember 2026"}]},{"key":"HZE","zeitraum":"Januar 2027","ziel":"bis 29. Januar 2027","fokus":"Basisstationen abschliessen und einen ersten Transferfall bearbeiten.","meilensteine":[{"nr":"M1","titel":"Modellanalyse und Prothesenplanung abschliessen","termin":"15. Januar 2027"},{"nr":"M2","titel":"Totalprothese, Modellguss und Kunststoff festigen","termin":"22. Januar 2027"},{"nr":"M3","titel":"Bereichscheck HZE abschliessen","termin":"29. Januar 2027"}]},{"key":"KFO","zeitraum":"Februar 2027","ziel":"bis 26. Februar 2027","fokus":"Basisstationen abschliessen, Fachbegriffe festigen und Selbsttest durchführen.","meilensteine":[{"nr":"M1","titel":"Gebiss- und Angle-Analyse sicher anwenden","termin":"12. Februar 2027"},{"nr":"M2","titel":"Geräte, Drähte, Schienen und digitale Verfahren unterscheiden","termin":"19. Februar 2027"},{"nr":"M3","titel":"Bereichscheck KFO abschliessen","termin":"26. Februar 2027"}]},{"key":"NSR","zeitraum":"März 2027","ziel":"bis 26. März 2027","fokus":"Basisstationen abschliessen und Reparatur-, Hygiene- und Kundensituationen verknüpfen.","meilensteine":[{"nr":"M1","titel":"Befund, Reparatur und Erweiterung planen","termin":"12. März 2027"},{"nr":"M2","titel":"Hygiene, Dokumentation und Kundengespräch verknüpfen","termin":"19. März 2027"},{"nr":"M3","titel":"Bereichscheck NSR abschliessen","termin":"26. März 2027"}]}]},"zone2":{"intro":"Jede Station folgt dem Schema: Ziel, Material, Auftrag, Ergebnissicherung, Check. Jede enthält einen kurzen Theorie-Input (max. 15 Min.) bzw. eine Lektüre und eine konkrete Verarbeitungsaufgabe."},"zone3":{"intro":"Differenzierung nach Tempo und Interesse. Wahlmöglichkeiten bei Lösungswegen und Darstellungsformen; Escape-Rätsel können den Selbsttest des Bereichs freischalten.","typen":[{"typ":"Wahlstation (V-…-1)","beschr":"«Wähle 2 aus 4» mit freier Darstellungsform","bsp":"Mindmap ODER Tabelle ODER Erklärclip"},{"typ":"Fallstudie / Fehleranalyse (V-…-2)","beschr":"Komplexe Fälle, Fehlerbilder, Praxisszenarien für Leistungsstärkere","bsp":"«Die Prothese drückt und wackelt»"},{"typ":"Mini-Escape (V-…-3)","beschr":"Logik- und Zuordnungsrätsel mit Code zur Freischaltung des Selbsttests","bsp":"«Der verschwundene Kronenrand»"},{"typ":"Integrationsfall (V-X-1)","beschr":"Bereichsübergreifender Fall für die Profi-Route","bsp":"«Frau M., 68 Jahre»"}]},"selftests":{"FZE":[{"q":"Nenne drei Präparationsformen für Kronen.","a":"Hohlkehle, Stufe (mit abgerundeter Innenkante), Tangential- bzw. Federrandpräparation."},{"q":"Warum müssen die Wärmeausdehnungskoeffizienten (WAK) von Legierung und Verblendkeramik aufeinander abgestimmt sein?","a":"Unterschiede erzeugen Spannungen im Verbund und können zu Rissen oder Abplatzungen führen; die Keramik soll gegenüber der Legierung leicht niedrigere WAK-Werte haben, damit sie unter Druckspannung steht."},{"q":"Welche Schritte folgen nach dem Fräsen einer Zirkonoxid-Krone im vorgesinterten Zustand?","a":"Ausarbeiten, gegebenenfalls Einfärben, Sintern (mit Schrumpfung gerechnet), anschliessend Glasur bzw. Verblendung und Endkontrolle."},{"q":"Wie heisst der Zahn 26 nach FDI-Schema?","a":"Oberer linker erster Molar."},{"q":"Nenne zwei mögliche Ursachen für Abplatzungen (Chipping) der Verblendkeramik.","a":"Z. B. unzureichende Unterstützung durch das Gerüst (zu dicke Keramikschicht), unpassende Abkühlung bzw. Brennführung, Überbelastung durch ungünstige Okklusion."}],"HZE":[{"q":"Wozu dient der Gesichtsbogen?","a":"Er überträgt die Lage des Oberkiefers in Bezug auf die Schädelbasis bzw. Scharnierachse auf den Artikulator."},{"q":"Was ist der Zahnäquator und welche Bedeutung hat er für Klammern?","a":"Der Äquator ist der grösste Umfang der Zahnkrone; retentive Klammerarme liegen unterhalb, stabilisierende oberhalb davon."},{"q":"Nenne die vier Kennedy-Klassen.","a":"I: beidseitige Freiendlücke; II: einseitige Freiendlücke; III: einseitige Schaltlücke; IV: Frontzahnlücke über die Mittellinie."},{"q":"Wozu dienen Ventilrand und dorsaler Abschluss (Postdamm) bei der Totalprothese?","a":"Sie sichern den randdichten Abschluss und damit die Haftung der Prothese durch Adhäsion und Unterdruck."},{"q":"Nenne zwei Verfahren zur Verarbeitung von Prothesenkunststoff.","a":"Heisspolymerisation, Kaltpolymerisation, Spritzguss, CAD/CAM-Fräsen."}],"KFO":[{"q":"Beschreibe die Angle-Klassen I bis III.","a":"I: Neutralbiss; II: Distalbiss; III: Mesialbiss."},{"q":"Was ist der Unterschied zwischen Overjet und Overbite?","a":"Overjet: horizontale (sagittale) Stufe der Frontzähne; Overbite: vertikaler Überbiss."},{"q":"Welche Aufgabe hat die Adams-Klammer?","a":"Sie sorgt für die Retention der herausnehmbaren Apparatur an den Molaren."},{"q":"Wozu dient eine Dehnschraube in einer aktiven Platte?","a":"Zur Erweiterung (z. B. transversal) durch schrittweise Aktivierung."},{"q":"Wozu dient ein Retainer nach der aktiven Behandlung?","a":"Er sichert das Behandlungsergebnis und beugt einem Rezidiv vor."}],"NSR":[{"q":"Worin unterscheiden sich Reparatur, Erweiterung und Unterfütterung?","a":"Reparatur: Wiederherstellung nach Schaden; Erweiterung: Ergänzung (z. B. fehlender Zahn); Unterfütterung: Anpassung der Prothesenbasis an das veränderte Prothesenlager."},{"q":"Nenne zwei Gründe für eine Neuanfertigung statt einer Reparatur.","a":"Z. B. wiederholte Frakturen, deutliche Passungsmängel, Materialermüdung, unwirtschaftlicher Aufwand."},{"q":"Was gehört in die Dokumentation eines Reparaturauftrags?","a":"Auftragsdaten, Schaden, durchgeführte Schritte, verwendete Materialien (inkl. Chargen, soweit relevant), Datum, Verantwortliche Person."},{"q":"Welche Hygienemassnahme gilt beim Eingang von Arbeiten aus der Praxis?","a":"Desinfektion gemäss Hygienekonzept des Betriebs vor der Bearbeitung."},{"q":"Nenne die vier Schritte eines Reklamationsgesprächs.","a":"Zuhören, Sachverhalt klären, Lösung anbieten, Vereinbarung festhalten."}]},"zone4":{"intro":"Selbsttests, formative Feedbackschleifen, gestufte Hilfen und Prüfungssimulation.","peer":{"id":"CP-2","title":"Peer-Feedback (Arbeiten, Skizzen, Präsentationen)","meta":"Pflicht · ca. 15 Min. pro Feedback","ziel":"Ich kann eine Arbeit nach Kriterien beurteilen und konkretes, wertschätzendes Feedback geben.","material":"Peer-Feedback-Raster (unten), Arbeit der Partnerperson.","auftrag":"Beurteile die Arbeit mit dem Raster. Formuliere 1 Stärke, 1 Verbesserungsvorschlag und 1 offene Frage (Format: «Mir gefällt …, ich schlage vor …, ich frage mich …»).","ergebnis":"Raster auf der Station der beurteilten Person (OneNote) bzw. Moodle-Workshop.","check":"Beurteilte Person bestätigt: Feedback ist verständlich und umsetzbar (Ja/Nein)."},"raster":[{"kriterium":"Fachliche Richtigkeit","s1":"Mehrere Fehler","s2":"Einzelne Fehler","s3":"Korrekt","s4":"Korrekt und differenziert begründet"},{"kriterium":"Vollständigkeit","s1":"Wesentliche Teile fehlen","s2":"Kleine Lücken","s3":"Vollständig","s4":"Vollständig und mit Zusatzaspekten"},{"kriterium":"Fachsprache","s1":"Alltagssprache","s2":"Teilweise Fachbegriffe","s3":"Fachbegriffe korrekt","s4":"Präzise und sicher"},{"kriterium":"Struktur / Darstellung","s1":"Unübersichtlich","s2":"Teilweise klar","s3":"Klar gegliedert","s4":"Klar, anschaulich, adressatengerecht"},{"kriterium":"Begründung / Transfer","s1":"Keine Begründung","s2":"Begründung unvollständig","s3":"Nachvollziehbar","s4":"Übertragung auf neuen Fall"}],"checkpoints":[{"cp":"CP-A","zeit":"Ende Phase 1","inhalt":"FZE/HZE: Basisstationen, Kurzgespräch am Modell, Ampelabgleich","form":"5–10 Min. pro Person"},{"cp":"CP-B","zeit":"Ende Phase 2","inhalt":"KFO/NSR: Drahtarbeit und Reparaturprotokoll sichten, Lernvertrag anpassen","form":"Kurzgespräch + Raster"},{"cp":"CP-C","zeit":"Ende Phase 3","inhalt":"Vertiefung/Portfolio: Auswahlkriterien, Feedback zu Fallstudien","form":"Portfolio-Review"},{"cp":"CP-D","zeit":"Phase 4","inhalt":"Prüfungssimulation: Fachgespräch, Kundengespräch, Zeitmanagement","form":"Simulation mit Beobachtungsbogen"}],"sim":{"id":"CP-5","title":"Mündliche Prüfungssimulation","meta":"Pflicht (Profi: erweitert) · ca. 20 Min. pro Person","ziel":"Ich kann fachlich korrekt und verständlich über meine Arbeit sprechen und ein Kundengespräch im Rollenspiel strukturiert führen.","material":"Fragenkarten (je Bereich 5 Fragen aus den Selbsttests plus 2 Transferfragen), Rollenkarten Kundengespräch, Beobachtungsbogen, Stoppuhr.","auftrag":"Dreiergruppe: Prüfling, Experte/Expertin, Beobachter/in. 1) Fachgespräch (ca. 10 Min.): Karten ziehen und beantworten. 2) Kundengespräch (ca. 8 Min.): Rolle «Zahnarztpraxis / Patient». 3) Feedback mit dem Raster aus 4.2.","ergebnis":"Beobachtungsbogen in OneNote; Reflexionsnotiz (3 Sätze).","check":"Peer-Feedback und Lehrperson-Checkpoint CP-D."},"simHinweis":"Formatangaben zu den QV-Prüfungsformen (Kundengespräch als Rollenspiel, Fachgespräch) stammen aus der Wegleitung 2022; bitte an die Wegleitung des Prüfungsjahres anpassen.","tippKonzept":"Jede anspruchsvolle Aufgabe hat bis zu drei Tipp-Karten. Hole Karte 1 erst nach eigenem Versuch und notiere, welche Karte du genutzt hast.","tipps":[{"stufe":"Tipp 1 · Denkanstoss","inhalt":"Verweis auf die relevante Skriptstelle oder eine Leitfrage","form":"Umschlag 1 / Moodle-Tipp 1"},{"stufe":"Tipp 2 · Teilschritt","inhalt":"Erster Lösungsschritt oder Teilbeispiel","form":"Umschlag 2 / Moodle-Tipp 2"},{"stufe":"Tipp 3 · Fast-Lösung","inhalt":"Lösungsweg ohne Endergebnis","form":"Umschlag 3 / Moodle-Tipp 3"},{"stufe":"Musterlösung","inhalt":"Vollständige Lösung zum Abgleich","form":"Nach Abgabe freigeschaltet"}],"tippBeispiel":{"titel":"Ordne einen Fall mit einseitiger Schaltlücke einer Kennedy-Klasse zu","tipps":["Wo liegt die Lücke: seitlich oder in der Front? Wie viele Seiten sind betroffen?","Prüfe, ob die Lücke hinten durch einen Zahn begrenzt ist (Schaltlücke) oder frei endet (Freiende).","Beidseitiges Freiende = Klasse I, einseitiges Freiende = Klasse II, einseitige Schaltlücke = Klasse III, Frontlücke über die Mittellinie = Klasse IV."],"muster":"Einseitige Schaltlücke = Klasse III nach Kennedy."}},"technik":[{"titel":"OneNote (Class Notebook)","text":"Inhaltsbibliothek (nur Lehrperson schreibt): Zone 1, Stationsvorlagen, Tipp-Karten, Musterlösungen (zeitverzögert freigeben).\nAbschnittsgruppen «Zone 2 Basis», «Zone 3 Vertiefung», «Zone 4 Checkpoint»; je Bereich ein Abschnitt (FZE, HZE, KFO, NSR), je Station eine Seite.\nPersönlicher Bereich der Lernenden: e-Portfolio mit Ergebnissicherung, Lernvertrag, Wochenplan."},{"titel":"Moodle (Grid-/Themenformat)","text":"Eine Kachel (Abschnitt) je Station; Zone 1 als erste Kachel «Start».\nAktivitäten: Aufgabe (Ergebnissicherung), Test (Selbsttest), Workshop (Peer-Feedback), H5P oder Lektion (Rätsel).\nFreischaltung über Zugriffsbeschränkungen. Das Grid-Format ist ein Zusatzplugin: Verfügbarkeit mit der Moodle-Administration prüfen (Faktenlage unsicher)."},{"titel":"Padlet / Genially","text":"Eine Kachel je Station, Bereichsfarben (Blau, Grün, Orange, Violett). Kachelrand: Blau = Pflicht, Orange = Wahl, Grün = Check.\nKacheln mit OneNote-Seiten bzw. Moodle-Aktivitäten verlinken; Rätsel als interaktive Hotspots (Genially)."},{"titel":"Diese HTML-Datei","text":"Pro Station gibt es «Als Text kopieren»: Der Textblock lässt sich direkt in OneNote- oder Moodle-Seiten einfügen."}],"quellen":["Ausführungsbestimmungen zum QV Zahntechniker/in EFZ (VZLS), Version 15. Januar 2020: https://www.vzls.ch/assets/Bildung/ausfuehrungsbestimmungen_qv_210312.pdf","Wegleitung zum QV Zahntechniker/in EFZ (VZLS), aktualisiert 21. Oktober 2022: https://www.vzls.ch/assets/Bildung/Neue_Wegleitung_Zahntechnik.pdf","Qualifikationsverfahren der Berufslehre, Kanton Zürich (Termine, Nachteilsausgleich): https://www.zh.ch/de/bildung/berufslehre/qualifikationsverfahren.html","Qualifikationsverfahren VZLS-ZH-SH (Prüfungsort Zug, Daten QV-2027 ab Februar 2027): https://www.vzls-zh-sh.ch/index.php/qualifikationsverfahren-3/","Notengewichtung (Drittquelle, nicht amtlich bestätigt): https://www.rhinoya.ch/blog/berechnungen/zahntechniker-in-efz"],"quellenHinweis":"Fachinhalte der Stationen (Werkstoffangaben, Arbeitsschritte, Sinterschrumpfung usw.) sind allgemein gehalten und mit Skript, Herstellerangaben und Betriebsstandards abzugleichen."}</script>
<script>
(function(){
"use strict";
/* ============ Daten laden ============ */
const EMBED = JSON.parse(document.getElementById('ll-data').textContent);
const LSK = 'll-data-v1', PSK = 'll-progress-v1';
function deep(o){return JSON.parse(JSON.stringify(o))}
function loadData(){
  let d = deep(EMBED);
  if(d.meta && d.meta.student) return d;
  try{
    const l = JSON.parse(localStorage.getItem(LSK)||'null');
    if(l && l.data && l.data.meta && (l.data.meta.updated||'') > (d.meta.updated||'')) d = l.data;
  }catch(e){}
  return d;
}
let D = loadData();
let P = (function(){try{return Object.assign({st:{},unlocked:{},vertrag:{},sec:{}},JSON.parse(localStorage.getItem(PSK)||'{}'))}catch(e){return {st:{},unlocked:{},vertrag:{},sec:{}}}})();
P.st=P.st||{};P.unlocked=P.unlocked||{};P.vertrag=P.vertrag||{};P.sec=P.sec||{};
const S = {tab:'z1',filter:'ALL',edit:false,teacher:false,open:new Set(),rev:new Set(),tipp:0};
const STUDENT = !!D.meta.student;

function saveData(){ if(STUDENT) return; D.meta.updated=new Date().toISOString(); try{localStorage.setItem(LSK,JSON.stringify({data:D}))}catch(e){} }
function saveP(){ try{localStorage.setItem(PSK,JSON.stringify(P))}catch(e){} }

/* ============ Helfer ============ */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gp=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const sp=(o,p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'');
const areaOf=k=>D.areas.find(a=>a.key===k)||{key:k,name:k,color:'#404040'};
const canEditUI=()=>!STUDENT;
const showT=()=>!STUDENT&&(S.teacher||S.edit);

function ed(path,cls,single){
  const v=gp(D,path);
  return `<div class="ed ${cls||''}" data-p="${path}" ${single?'data-s="1"':''} ${S.edit?'contenteditable="true"':''}>${esc(v)}</div>`;
}
function tbl(path,cols,tpl){
  const rows=gp(D,path)||[];
  return `<div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}${S.edit?'<th></th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${ed(path+'.'+i+'.'+c[0])}</td>`).join('')}${S.edit?`<td><button class="mini" data-act="delRow" data-p="${path}" data-i="${i}" title="Zeile löschen">✕</button></td>`:''}</tr>`).join('')}</tbody></table></div>${S.edit?`<button class="btn sm" data-act="addRow" data-p="${path}" data-tpl="${tpl}">＋ Zeile</button>`:''}`;
}
function list(path,tpl,checkKey,addLabel){
  const a=gp(D,path)||[];
  return `<ul class="l ${checkKey?'vl':''}">${a.map((x,i)=>`<li>${checkKey?`<input type="checkbox" data-act="chk" data-k="${checkKey}" data-i="${i}" ${P[checkKey][i]?'checked':''}>`:''}<span style="flex:1">${ed(path+'.'+i)}</span>${S.edit?`<button class="mini" data-act="delRow" data-p="${path}" data-i="${i}">✕</button>`:''}</li>`).join('')}</ul>${S.edit?`<button class="btn sm" data-act="addRow" data-p="${path}" data-tpl="${tpl}">${addLabel||'＋ Eintrag'}</button>`:''}`;
}
const TPL={
  zeit:{phase:'Neue Phase',zeitraum:'',inhalt:'',termin:''},
  pfad:{weg:'Neu',was:'',voraus:'',fuer:'',lp:''},
  str:'', typ:{typ:'',beschr:'',bsp:''},
  qa:{q:'Neue Frage',a:'Musterlösung'},
  raster:{kriterium:'Kriterium',s1:'',s2:'',s3:'',s4:''},
  cp:{cp:'CP-X',zeit:'',inhalt:'',form:''},
  tipp:{stufe:'Stufe',inhalt:'',form:''},
  tech:{titel:'Neu',text:''}
};

/* ============ Station ============ */
const FIELDS=[['Ziel','ziel'],['Material','material'],['Auftrag','auftrag'],['Ergebnissicherung','ergebnis'],['Check','check']];
function amp(id){
  const v=(P.st[id]||{}).amp||0;
  return `<div class="amp" title="Selbsteinschätzung: rot = unsicher, orange = mit Hilfe, grün = sicher">${[1,2,3].map(n=>`<button data-act="amp" data-id="${id}" data-v="${n}" class="${v===n?'on':''}"></button>`).join('')}</div>`;
}
function stationCard(s,path,color,listIdx){
  const isList=listIdx!=null;
  const open=S.edit||S.open.has(s.id);
  const hasCode=s.type==='escape';
  let body=FIELDS.map(f=>`<div class="row"><div class="l">${f[0]}</div><div class="v">${ed(path+'.'+f[1])}</div></div>`).join('');
  if(hasCode){
    const done=!!P.unlocked[s.unlocks];
    body+=`<div class="row"><div class="l">Code eingeben</div><div class="v">
      ${done?`<div class="okbox">✔ Gelöst – der Checkpoint «${esc(s.unlocks)}» ist freigeschaltet.</div>`:''}
      <div class="code"><input type="text" id="code-${esc(s.id)}" placeholder="Lösungscode" autocomplete="off"><button class="btn" data-act="code" data-id="${esc(s.id)}">Prüfen</button><span id="codemsg-${esc(s.id)}"></span></div></div></div>`;
    if(showT()) body+=`<div class="row lp"><div class="l">Code (Lehrperson)</div><div class="v">${ed(path+'.code')}<div class="pill">schaltet frei: ${ed(path+'.unlocks')}</div></div></div>`;
  }
  if(showT()) body+=`<div class="row lp"><div class="l">Notiz (Lehrperson)</div><div class="v">${ed(path+'.lp')}</div></div>`;
  if(showT()) body+=`<div class="row lp"><div class="l">Zusätzliche Felder</div><div class="v">${list(path+'.lpExtras','str',null,'＋ Feld hinzufügen')}</div></div>`;
  let tools='';
  if(!STUDENT||true){
    tools=`<div class="tools"><button class="btn sm" data-act="copy" data-id="${esc(s.id)}" data-p="${path}">⧉ Als Text kopieren (OneNote/Moodle)</button>`;
    if(isList&&S.edit) tools+=`<button class="btn sm" data-act="mv" data-i="${listIdx}" data-d="-1">↑</button><button class="btn sm" data-act="mv" data-i="${listIdx}" data-d="1">↓</button><button class="btn sm" data-act="delSt" data-i="${listIdx}">🗑 Station löschen</button>`;
    tools+='</div>';
  }
  return `<div class="st ${open?'open':''}" style="--c:${color}" data-id="${esc(s.id)}">
    <div class="sh"><span class="id">${ed(path+'.id','',1)}</span><span class="ti">${ed(path+'.title','',1)}</span>${isList?amp(s.id):''}<span class="me">${ed(path+'.meta','',1)}</span></div>
    <div class="sb">${body}${tools}</div></div>`;
}
function stationsOf(zone,areaKey){return D.stations.map((s,i)=>({s,i})).filter(o=>o.s.zone===zone&&o.s.area===areaKey)}
function stationList(zone,areaKey){
  const a=areaOf(areaKey);
  const rows=stationsOf(zone,areaKey);
  return rows.map(o=>stationCard(o.s,'stations.'+o.i,a.color,o.i)).join('')+(S.edit?`<button class="btn sm" data-act="addSt" data-zone="${zone}" data-area="${areaKey}">＋ Station in «${esc(areaKey)}» hinzufügen</button>`:'');
}
function filterBar(){
  return `<div class="chips">${['ALL',...D.areas.filter(a=>a.key!=='X').map(a=>a.key)].map(k=>`<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-k="${k}">${k==='ALL'?'Alle Bereiche':k}</button>`).join('')}<button class="chip" data-act="allopen">Alle auf-/zuklappen</button></div>`;
}
const visibleAreas=(incX)=>D.areas.filter(a=>(incX||a.key!=='X')&&(S.filter==='ALL'||S.filter===a.key));

/* ============ Fortschritt ============ */
function areaProg(k){
  const b=D.stations.filter(s=>s.zone==='basis'&&s.area===k);
  if(!b.length) return {n:0,g:0,p:0};
  const g=b.filter(s=>(P.st[s.id]||{}).amp===3).length;
  return {n:b.length,g,p:Math.round(100*g/b.length)};
}

/* ============ Zonen ============ */
function areaTimeline(){
  const rows=D.zone1.bereichsTimeline||[];
  if(!rows.length)return '';
  return `<h3>Ideale Timeline für die vier QV-Bereiche</h3><div class="timeline-note"><b>Ziel:</b> Bis Ende März 2027 sind alle vier Pflichtbereiche abgeschlossen. April und Mai bleiben für Vertiefung, Wiederholung und Prüfungssimulation.</div><div class="area-timeline">${rows.map((r,i)=>{const a=areaOf(r.key),base=`zone1.bereichsTimeline.${i}`,ms=r.meilensteine||[];return `<div class="tl-item" style="--tl:${a.color}"><div class="tl-dot"></div><div class="tl-key">${esc(a.key)}</div><div class="tl-name">${esc(a.name)}</div><div class="tl-period">${ed(base+'.zeitraum')}</div><div class="tl-goal">Abschluss ${ed(base+'.ziel','',true)}</div><div class="tl-focus">${ed(base+'.fokus')}</div><div class="tl-ms"><div class="tl-ms-title">Meilensteine</div>${ms.map((x,j)=>`<div class="tl-ms-row"><div class="tl-ms-head"><div class="tl-ms-nr">${ed(base+'.meilensteine.'+j+'.nr','',true)}</div><div class="tl-ms-text">${ed(base+'.meilensteine.'+j+'.titel')}</div>${S.edit?`<button class="mini" data-act="delMilestone" data-i="${i}" data-j="${j}" title="Meilenstein löschen">✕</button>`:''}</div><div class="tl-ms-date">Termin: ${ed(base+'.meilensteine.'+j+'.termin','',true)}</div></div>`).join('')}${S.edit?`<div class="tl-actions"><button class="btn sm" data-act="addMilestone" data-i="${i}">＋ Meilenstein</button></div>`:''}</div></div>`}).join('')}</div>`;
}
function z1(){
  const z=D.zone1;
  let h=`<div class="hero"><h2>Zone 1 · Orientierung und Einstieg</h2><div class="intro">${ed('zone1.intro')}</div></div>`;
  h+=`<h3>Meine Lernziele – am Ende kann ich …</h3><div class="card">${list('zone1.lernziele','str')}</div>`;
  h+=`<h3>Landkarte der vier QV-Themenbereiche</h3><div class="grid4">`+D.areas.filter(a=>a.key!=='X').map((a,i)=>{
    const p=areaProg(a.key), nb=stationsOf('basis',a.key).length, nv=stationsOf('vertiefung',a.key).length;
    return `<div class="card area" style="--c:${a.color}"><h3>${esc(a.key)} · ${ed('areas.'+D.areas.indexOf(a)+'.name','','1')}</h3>${ed('areas.'+D.areas.indexOf(a)+'.inhalt')}
    <div class="prog"><i style="width:${p.p}%"></i></div><div style="font-size:12.5px;color:var(--mut)">${p.g} von ${p.n} Basisstationen grün (${p.p} %)</div>
    <div style="font-size:12.5px;margin:4px 0">${nb} Basis · ${nv} Vertiefung</div>
    <button class="btn sm" data-act="go" data-tab="z2" data-k="${a.key}">Zu den Basisstationen</button> <button class="btn sm" data-act="go" data-tab="z3" data-k="${a.key}">Zur Vertiefung</button></div>`}).join('')+`</div>`;
  h+=areaTimeline();
  h+=`<h3>Zeitplan mit Meilensteinen</h3><div class="intro">${ed('zone1.zeitplanHinweis')}</div>`+tbl('zone1.zeitplan',[['phase','Phase'],['zeitraum','Zeitraum (Vorschlag)'],['inhalt','Inhalt / Meilenstein'],['termin','Abgabe / Termin']],'zeit');
  h+=`<div class="card" style="border-left:6px solid var(--mid)">${ed('zone1.nachteilsausgleich')}</div>`;
  h+=`<h3>Pflichtpfad (Basis) und Wahlbereich (Vertiefung/Profi)</h3>`+tbl('zone1.pfade',[['weg','Weg'],['was','Was ich mache'],['voraus','Voraussetzung / Freischaltung'],['fuer','Geeignet für'],...(showT()?[['lp','Zusatz (Lehrperson, optional)']]:[])],'pfad');
  h+=`<div class="intro">${ed('zone1.ampelHinweis')}</div>`;
  h+=`<h3>Mein Lernvertrag</h3><div class="card">${list('zone1.vertrag','str','vertrag')}</div>`;
  if(showT()) h+=`<div class="teacher"><h3>Hinweise für die Lehrperson</h3>${list('zone1.hinweise','str')}</div>`;
  return h;
}
function z2(){
  let h=`<h2>Zone 2 · Basisstationen (Pflichtpfad)</h2><div class="intro">${ed('zone2.intro')}</div>`+filterBar();
  visibleAreas(false).forEach(a=>{
    h+=`<h3 style="color:${a.color}">${esc(a.key)} · ${esc(a.name)}</h3>`+stationList('basis',a.key);
    const rows=stationsOf('basis',a.key);
    h+=`<div class="card" style="border-top:5px solid ${a.color}"><b>Kompetenzraster ${esc(a.key)}</b> – Selbsteinschätzung<div class="tw"><table class="t"><thead><tr><th>Station</th><th>Ich kann …</th><th>Ampel</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.s.id)}</td><td>${esc(o.s.ziel)}</td><td>${amp(o.s.id)}</td></tr>`).join('')}</tbody></table></div></div>`;
  });
  return h;
}
function z3(){
  let h=`<h2>Zone 3 · Vertiefungs- und Transferinseln (Wahlbereich)</h2><div class="intro">${ed('zone3.intro')}</div>`+tbl('zone3.typen',[['typ','Insel-Typ'],['beschr','Beschreibung'],['bsp','Beispiel']],'typ')+filterBar();
  visibleAreas(true).forEach(a=>{
    h+=`<h3 style="color:${a.color}">${esc(a.key==='X'?'Bereichsübergreifend':a.key+' · '+a.name)}</h3>`+stationList('vertiefung',a.key);
  });
  const esc_=D.stations.filter(s=>s.type==='escape');
  h+=`<h3>Freischaltlogik der Escape-Elemente</h3><div class="card"><div class="tw"><table class="t"><thead><tr><th>Escape</th><th>Schaltet frei</th><th>Status</th>${showT()?'<th>Code (Lehrperson)</th>':''}</tr></thead><tbody>${esc_.map(s=>`<tr><td>${esc(s.id)} · ${esc(s.title)}</td><td>Selbsttest ${esc(s.unlocks)}</td><td>${P.unlocked[s.unlocks]?'✔ gelöst':'offen'}</td>${showT()?`<td>${esc(s.code||'(nur Hash gespeichert)')}</td>`:''}</tr>`).join('')}</tbody></table></div>
  ${showT()?`<label><input type="checkbox" data-act="lockset" ${D.meta.lockSelftests?'checked':''}> Selbsttests erst nach gelöstem Escape freischalten (Standard: aus, weil Escape-Rätsel zum Wahlbereich gehören)</label>`:''}</div>`;
  return h;
}
function selftest(k){
  const a=areaOf(k), qs=D.selftests[k]||[];
  const locked=D.meta.lockSelftests&&!P.unlocked[k]&&D.stations.some(s=>s.type==='escape'&&s.unlocks===k)&&!showT();
  let h=`<h3 style="color:${a.color}">Selbsttest ${esc(k)} · ${esc(a.name)}</h3>`;
  if(locked) return h+`<div class="lock">🔒 Dieser Selbsttest wird durch den Escape-Code des Bereichs ${esc(k)} freigeschaltet (Zone 3).</div>`;
  const marks=(P.sec[k]=P.sec[k]||{});
  const ok=qs.filter((q,i)=>marks[i]==='ok').length, pct=qs.length?Math.round(100*ok/qs.length):0;
  h+=`<div class="intro">Beantworten Sie die Fragen zuerst ohne Unterlagen, decken Sie danach die Musterlösung auf und schätzen Sie sich selbst ein. Ab 80 % richtig: Ampel grün.</div>`;
  h+=qs.map((q,i)=>{
    const key=k+'.'+i, show=S.rev.has(key)||S.edit||S.teacher&&!STUDENT;
    return `<div class="q ${marks[i]||''}"><b>${i+1}.</b> ${ed('selftests.'+k+'.'+i+'.q')}
      ${show?`<div class="a">${ed('selftests.'+k+'.'+i+'.a')}</div>`:''}
      <div class="tools" style="padding:6px 0;background:none;border:0">${show?`<button class="btn sm" data-act="mark" data-k="${k}" data-i="${i}" data-v="ok">✔ Konnte ich beantworten</button><button class="btn sm" data-act="mark" data-k="${k}" data-i="${i}" data-v="no">✖ Weiter üben</button>${(!S.edit&&!S.teacher)?`<button class="btn sm" data-act="revhide" data-key="${key}">Antwort verbergen</button>`:''}`:`<button class="btn sm" data-act="rev" data-key="${key}">Musterlösung anzeigen</button>`}
      ${S.edit?`<button class="mini" data-act="delRow" data-p="selftests.${k}" data-i="${i}">✕</button>`:''}</div></div>`}).join('');
  if(S.edit) h+=`<button class="btn sm" data-act="addRow" data-p="selftests.${k}" data-tpl="qa">＋ Frage</button>`;
  h+=`<div class="prog" style="--c:${a.color}"><i style="width:${pct}%"></i></div><div>${ok} von ${qs.length} richtig (${pct} %)${pct>=80?' – <b style="color:var(--ok)">Bereich sicher ✔</b>':''}</div>`;
  return h;
}
function z4(){
  const z=D.zone4;
  let h=`<h2>Zone 4 · Checkpoint und Reflexion</h2><div class="intro">${ed('zone4.intro')}</div><h2 style="font-size:19px">4.1 Selbsttests mit Musterlösungen</h2><div class="card"><button class="btn sm" data-act="expandSelftests">Alle aufklappen</button> <button class="btn sm" data-act="collapseSelftests">Alle zuklappen</button></div>`+filterBar();
  visibleAreas(false).forEach(a=>{h+=selftest(a.key)});
  h+=`<h2 style="font-size:19px">4.2 Peer-Feedback</h2>`+stationCard(z.peer,'zone4.peer','#404040')+tbl('zone4.raster',[['kriterium','Kriterium'],['s1','Stufe 1: noch nicht'],['s2','Stufe 2: teilweise'],['s3','Stufe 3: erfüllt'],['s4','Stufe 4: übertroffen']],'raster');
  h+=`<h2 style="font-size:19px">4.3 Lehrperson-Checkpoints</h2>`+tbl('zone4.checkpoints',[['cp','Checkpoint'],['zeit','Zeitpunkt'],['inhalt','Inhalt'],['form','Form']],'cp');
  h+=`<h2 style="font-size:19px">4.4 Mündliche Prüfungssimulation</h2>`+stationCard(z.sim,'zone4.sim','#404040')+`<div class="intro">${ed('zone4.simHinweis')}</div>`;
  h+=`<h2 style="font-size:19px">4.5 Gestufte Hilfen (Tipp-Karten) und Musterlösungen</h2><div class="intro">${ed('zone4.tippKonzept')}</div>`+tbl('zone4.tipps',[['stufe','Stufe'],['inhalt','Inhalt'],['form','Form']],'tipp');
  const tb=z.tippBeispiel;
  h+=`<div class="card"><b>Beispiel: ${ed('zone4.tippBeispiel.titel')}</b><div>${tb.tipps.map((t,i)=>S.tipp>i||S.edit?`<div class="tipp"><b>Tipp ${i+1}:</b> ${ed('zone4.tippBeispiel.tipps.'+i)}</div>`:'').join('')}
  ${S.tipp>=3||S.edit?`<div class="tipp" style="background:#f1f8f1;border-color:#9ccc9f"><b>Musterlösung:</b> ${ed('zone4.tippBeispiel.muster')}</div>`:''}
  ${(S.tipp<4&&!S.edit)?`<button class="btn sm" data-act="tipp">${S.tipp<3?'Nächsten Tipp anzeigen (erst nach eigenem Lösungsversuch)':'Musterlösung anzeigen'}</button>`:`<button class="btn sm" data-act="tippreset">Zurücksetzen</button>`}</div></div>`;
  return h;
}
function z5(){
  let h=`<h2>Hilfe, Technik und Quellen</h2>`;
  if(!STUDENT) h+=`<div class="card"><h3 style="margin-top:0">So passen Sie die Lernlandschaft an</h3><ol>
   <li>Oben <b>✎ Bearbeiten</b> einschalten: Alle gestrichelt umrandeten Felder sind direkt im Browser editierbar (Texte, Tabellen, Fragen, Stationen). Mit «＋» fügen Sie Zeilen, Fragen oder Stationen hinzu, mit «✕»/«🗑» löschen Sie, mit ↑/↓ verschieben Sie Stationen.</li>
   <li>Änderungen werden automatisch im Browser gespeichert. Für die Weitergabe: <b>⭳ HTML speichern</b> (vollständige Arbeitsversion) oder <b>⭳ Schülerversion</b> (ohne Codes und Lehrpersonen-Notizen, Bearbeiten-Funktion entfernt).</li>
   <li><b>⭳ Daten (JSON)</b> sichert den reinen Inhalt; <b>⭱ Daten laden</b> stellt ihn wieder her (z. B. für die nächste Klasse). Die JSON-Datei können Sie auch in einem Texteditor bearbeiten.</li>
   <li>Pro Station: <b>Als Text kopieren</b> erzeugt einen Textblock zum Einfügen in OneNote oder Moodle.</li>
   <li>Der Lernfortschritt (Ampel, Selbsttests, Lernvertrag, Escape) wird pro Lernendem im jeweiligen Browser gespeichert und ist unabhängig vom Inhalt.</li></ol>
   <p style="color:var(--mut);font-size:13px">Hinweis: Die Schülerversion speichert Codes nur als Hash. Das ist ein Spielschutz, kein Sicherheitsmerkmal. Die Musterlösungen der Selbsttests stehen im Quelltext der Datei.</p></div>`;
  h+=`<h3>Technische Adaption</h3>`+tbl('technik',[['titel','Plattform / Thema'],['text','Struktur-Vorschlag']],'tech');
  h+=`<h3>Quellen und Hinweise zur Prüfung der Fakten</h3><div class="card">${list('quellen','str')}</div><div class="intro">${ed('quellenHinweis')}</div>`;
  return h;
}

/* ============ Render ============ */
const TABS=[['z1','1 Orientierung'],['z2','2 Basis'],['z3','3 Vertiefung'],['z4','4 Checkpoint'],['z5','Hilfe & Quellen']];
function renderHeader(){
  const m=D.meta;
  document.title=m.title;
  document.getElementById('hd').innerHTML=`<h1>${ed('meta.title','','1')}</h1><div class="sub">${ed('meta.subtitle','','1')}</div>
  <div class="bar">${STUDENT?'':`<button class="btn ${S.edit?'on':''}" data-act="edit">✎ Bearbeiten ${S.edit?'(an)':''}</button><button class="btn ${S.teacher?'on':''}" data-act="teacher">👁 Lehrpersonen-Ansicht</button><button class="btn" data-act="exphtml">⭳ HTML speichern</button><button class="btn" data-act="expstu">⭳ Schülerversion</button><button class="btn" data-act="expjson">⭳ Daten (JSON)</button><button class="btn" data-act="impjson">⭱ Daten laden</button><button class="btn" data-act="reset">↺ Auf eingebettete Fassung zurück</button>`}
  <button class="btn" data-act="resetp">Mein Fortschritt zurücksetzen</button><button class="btn" data-act="print">🖶 Drucken</button><input type="file" id="fi" accept=".json,application/json" hidden></div>
  <div class="tabs">${TABS.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
}
function render(){
  const y=window.scrollY;
  document.body.classList.toggle('edit',S.edit);
  renderHeader();
  const m={z1,z2,z3,z4,z5}[S.tab]();
  document.getElementById('app').innerHTML=m+`<footer>Stand: ${esc((D.meta.updated||'').slice(0,10))} · ${esc(D.meta.title)}</footer>`;
  window.scrollTo(0,y);
}

/* ============ Export ============ */
function buildHtml(data){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#hd').innerHTML='';
  c.querySelector('body').className='';
  c.querySelector('#ll-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function studentData(){
  const d=deep(D);d.meta.student=true;d.meta.updated=new Date().toISOString();
  d.stations.forEach(s=>{if(s.type==='escape'){s.codeHash=s.codeHash||h53(norm(s.code));delete s.code}delete s.lp});
  d.zone1.hinweise=[];
  return d;
}
const stamp=()=>new Date().toISOString().slice(0,10);
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Kopiert')).catch(()=>fb(t))}else fb(t);
  function fb(t){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Kopiert')}catch(e){}x.remove()}
}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f3864;color:#fff;padding:8px 16px;border-radius:20px;z-index:99';document.body.appendChild(t);setTimeout(()=>t.remove(),1400)}

/* ============ Events ============ */
document.addEventListener('input',e=>{
  const el=e.target.closest('.ed[data-p]');if(!el||!S.edit)return;
  sp(D,el.dataset.p,el.innerText.replace(/\n$/,''));saveData();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('.ed[data-s]')){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('.ed[contenteditable="true"]');if(!el)return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='chk'){P[t.dataset.k][t.dataset.i]=t.checked;saveP()}
  if(t.dataset.act==='lockset'){D.meta.lockSelftests=t.checked;saveData()}
  if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.stations||!o.areas)throw 0;D=o;saveData();render();toast('Daten geladen')}catch(x){alert('Die Datei ist keine gültige Lernlandschaft-JSON.')}};r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){
    const h=e.target.closest('.sh');
    if(h&&!e.target.closest('[contenteditable="true"]')&&!e.target.closest('.amp')){
      const st=h.parentElement,id=st.dataset.id;st.classList.toggle('open');
      st.classList.contains('open')?S.open.add(id):S.open.delete(id);
    }
    return;
  }
  const d=b.dataset,a=d.act;
  if(a==='chk'||a==='lockset')return;
  if(a==='tab'){S.tab=d.t;render();window.scrollTo(0,0)}
  else if(a==='go'){S.tab=d.tab;S.filter=d.k;render();window.scrollTo(0,0)}
  else if(a==='filter'){S.filter=d.k;render()}
  else if(a==='allopen'){const all=D.stations.filter(s=>S.filter==='ALL'||s.area===S.filter);const anyClosed=all.some(s=>!S.open.has(s.id));all.forEach(s=>anyClosed?S.open.add(s.id):S.open.delete(s.id));render()}
  else if(a==='edit'){S.edit=!S.edit;render()}
  else if(a==='teacher'){S.teacher=!S.teacher;render()}
  else if(a==='amp'){const o=P.st[d.id]=P.st[d.id]||{};o.amp=(o.amp===+d.v)?0:+d.v;saveP();render()}
  else if(a==='rev'){S.rev.add(d.key);render()}
  else if(a==='revhide'){S.rev.delete(d.key);render()}
  else if(a==='mark'){P.sec[d.k]=P.sec[d.k]||{};P.sec[d.k][d.i]=d.v;saveP();render()}
  else if(a==='tipp'){S.tipp++;render()}
  else if(a==='tippreset'){S.tipp=0;render()}
  else if(a==='code'){
    const s=D.stations.find(x=>x.id===d.id),inp=document.getElementById('code-'+d.id),msg=document.getElementById('codemsg-'+d.id);
    const exp=s.codeHash||h53(norm(s.code));
    if(h53(norm(inp.value))===exp&&norm(inp.value)){P.unlocked[s.unlocks]=true;saveP();render()}
    else{msg.textContent='❌ Nicht ganz – prüfe die Rätselkarten nochmals (Tipp-Karte nutzen).';msg.style.color='#c62828'}
  }
  else if(a==='copy'){
    const s=gp(D,d.p);
    copyText(`${s.id} · ${s.title}\n(${s.meta})\n\nZiel:\n${s.ziel}\n\nMaterial:\n${s.material}\n\nAuftrag:\n${s.auftrag}\n\nErgebnissicherung:\n${s.ergebnis}\n\nCheck:\n${s.check}\n`);
  }
  else if(a==='addMilestone'){const r=D.zone1.bereichsTimeline[+d.i];r.meilensteine=r.meilensteine||[];r.meilensteine.push({nr:'M'+(r.meilensteine.length+1),titel:'Neuer Meilenstein',termin:'Datum'});saveData();render()}
  else if(a==='delMilestone'){if(confirm('Meilenstein löschen?')){D.zone1.bereichsTimeline[+d.i].meilensteine.splice(+d.j,1);saveData();render()}}
  else if(a==='addRow'){let arr=gp(D,d.p);if(!arr){sp(D,d.p,[]);arr=gp(D,d.p)}arr.push(deep({v:TPL[d.tpl]}).v);saveData();render()}
  else if(a==='delRow'){if(confirm('Eintrag löschen?')){gp(D,d.p).splice(+d.i,1);saveData();render()}}
  else if(a==='addSt'){
    const pre=d.zone==='basis'?'B':'V';const n=stationsOf(d.zone,d.area).length;let k=n+1,id;
    do{id=`${pre}-${d.area}-${k++}`}while(D.stations.some(s=>s.id===id));
    const nz={id,title:'Neue Station',meta:(d.zone==='basis'?'Pflicht':'Wahl')+' · ca. 90 Min.',zone:d.zone,area:d.area,ziel:'Ich kann …',material:'',auftrag:'',ergebnis:'',check:'',lp:''};
    // hinter die letzte Station derselben Gruppe einfügen
    let last=-1;D.stations.forEach((s,i)=>{if(s.zone===d.zone&&s.area===d.area)last=i});
    D.stations.splice(last<0?D.stations.length:last+1,0,nz);S.open.add(id);saveData();render();
  }
  else if(a==='delSt'){if(confirm('Station endgültig löschen?')){D.stations.splice(+d.i,1);saveData();render()}}
  else if(a==='mv'){
    const i=+d.i,dir=+d.d,s=D.stations[i];let j=i+dir;
    while(j>=0&&j<D.stations.length&&!(D.stations[j].zone===s.zone&&D.stations[j].area===s.area))j+=dir;
    if(j>=0&&j<D.stations.length){[D.stations[i],D.stations[j]]=[D.stations[j],D.stations[i]];saveData();render()}
  }
  else if(a==='exphtml'){D.meta.updated=new Date().toISOString();saveData();dl(`Lernlandschaft_${stamp()}.html`,buildHtml(D))}
  else if(a==='expstu'){dl(`Lernlandschaft_Schueler_${stamp()}.html`,buildHtml(studentData()))}
  else if(a==='expjson'){dl(`Lernlandschaft_Daten_${stamp()}.json`,JSON.stringify(D,null,2),'application/json')}
  else if(a==='impjson'){document.getElementById('fi').click()}
  else if(a==='reset'){if(confirm('Alle lokalen Änderungen verwerfen und die in dieser Datei eingebettete Fassung laden?')){localStorage.removeItem(LSK);D=deep(EMBED);render()}}
  else if(a==='expandSelftests'){Object.keys(D.selftests||{}).forEach(k=>(D.selftests[k]||[]).forEach((q,i)=>S.rev.add(k+'.'+i)));render()} else if(a==='collapseSelftests'){S.rev.clear();render()} else if(a==='resetp'){if(confirm('Ihren Lernfortschritt (Ampel, Selbsttests, Lernvertrag, Escape) zurücksetzen?')){P={st:{},unlocked:{},vertrag:{},sec:{}};saveP();render()}}
  else if(a==='print'){window.print()}
});
render();
})();
</script>
</body>
</html>
